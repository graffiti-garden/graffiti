name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_repositories: ${{ steps.pages.outputs.repositories }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read Pages site configuration
        id: pages
        run: echo "repositories=$(jq -c 'map(.repository)' .github/pages-sites.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@latest
        working-directory: /tmp

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build workspaces
        run: npm run build

      - name: Check workspaces
        run: npm run check

      - name: Test workspaces
        run: npm test

      - name: Bundle external Pages sites
        run: |
          mkdir -p api/docs/deployment-assets

          jq -r '.[] | [.repository, .output] | @tsv' .github/pages-sites.json |
            while IFS=$'\t' read -r repository output; do
              test -f "$output/index.html"
              tar -czf "api/docs/deployment-assets/$repository.tar.gz" -C "$output" .
            done

      - name: Save API documentation for Pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: api-pages
          path: api/docs
          retention-days: 1

  deploy-api:
    name: Deploy API documentation
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: api-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download API documentation
        uses: actions/download-artifact@v5
        with:
          name: api-pages
          path: api/docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: api/docs

      - name: Deploy API documentation
        id: deployment
        uses: actions/deploy-pages@v4

  dispatch-pages:
    name: Dispatch ${{ matrix.repository }}
    needs: [validate, deploy-api]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.validate.outputs.pages_repositories) }}
    steps:
      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
        run: >-
          gh api
          --method POST
          "repos/graffiti-garden/$TARGET_REPOSITORY/dispatches"
          -f event_type=graffiti-pages-deploy
          --silent

  release-packages:
    name: Version or publish packages
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: npm-packages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@latest
        working-directory: /tmp

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create release pull request or publish packages
        uses: changesets/action@v2
        with:
          publish-script: npm run release
