<!doctype html><meta charset="utf-8" />
<script type="module">
  import { prepare, run, scenarios } from "/benchmark.js";
  const send = (data) =>
    parent.postMessage({ attestationBenchmark: true, ...data }, "*");
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  const tasks = [];
  new PerformanceObserver((list) =>
    tasks.push(
      ...list.getEntries().map((e) => ({ start: e.startTime, ms: e.duration })),
    ),
  ).observe({ type: "longtask", buffered: true });
  try {
    await prepare();
    // Equal unreported warm-up for both paths. Every measured run gets a fresh cache.
    for (const scenario of scenarios)
      for (const mode of ["baseline", "memo"]) await run(scenario.name, mode);
    for (let trial = 0; trial < 5; trial++)
      for (const scenario of trial % 2 ? [...scenarios].reverse() : scenarios)
        for (const mode of trial % 2
          ? ["memo", "baseline"]
          : ["baseline", "memo"]) {
          await pause(80);
          const start = performance.now();
          const result = await run(scenario.name, mode);
          const end = performance.now();
          await pause(80);
          if (!result.alteredBytesRejected)
            throw Error("Changed storage bytes were accepted");
          send({
            state: "running",
            result: {
              ...result,
              trial,
              longTasks: tasks.filter(
                (t) => t.start < end && t.start + t.ms > start,
              ),
            },
          });
        }
    send({ state: "complete" });
  } catch (error) {
    send({ state: "error", error: String(error) });
  }
</script>
