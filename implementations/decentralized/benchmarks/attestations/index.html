<!doctype html><meta charset="utf-8" /><title>
  Channel attestation browser benchmark
</title>
<style>
  body {
    font: 16px system-ui;
    margin: 32px;
    max-width: 1000px;
  }
  pre {
    white-space: pre-wrap;
  }
  iframe {
    width: 24px;
    height: 24px;
    position: fixed;
    bottom: 0;
  }
</style>
<h1>Channel attestation browser benchmark</h1>
<p>
  Full object validation using synthetic pixel-shaped objects, real Noble
  verification, and exact memoization. No production network or account access.
</p>
<pre id="output">Preparing synthetic data…</pre>
<script type="module">
  const output = document.querySelector("#output"),
    results = [],
    runId = new Date().toISOString().replace(/[^\dT]/g, "-");
  let writes = Promise.resolve();
  const manifest = await (await fetch("/manifest.json")).json();
  const frame = document.createElement("iframe");
  frame.sandbox.add("allow-scripts");
  frame.src = "/frame.html";
  document.body.append(frame);
  addEventListener("message", async (e) => {
    if (
      e.source !== frame.contentWindow ||
      e.origin !== "null" ||
      !e.data?.attestationBenchmark
    )
      return;
    if (e.data.result) results.push(e.data.result);
    output.textContent = JSON.stringify(
      { state: e.data.state, results },
      null,
      2,
    );
    const body = JSON.stringify({
      runId,
      manifest,
      userAgent: navigator.userAgent,
      opaqueOriginVerified: true,
      visibility: document.visibilityState,
      state: e.data.state,
      error: e.data.error,
      results,
      completed: e.data.state === "complete",
    });
    writes = writes
      .then(() =>
        fetch("/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
        }),
      )
      .catch((error) => {
        output.textContent += "\nSave error: " + error;
      });
    if (e.data.state === "complete")
      document.title = "Complete — channel attestation benchmark";
  });
</script>
